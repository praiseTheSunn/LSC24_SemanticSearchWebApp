services:
  main:
    volumes:
      - ./main:/app/main
      - ./libs:/app/libs
      - ./configs:/app/configs
    command: >
      conda run --no-capture-output -n py311_env
      uvicorn main:app
      --host 0.0.0.0
      --port 20721
      --reload

  embedding_compute:
    volumes:
      - ./embedding_compute:/app/embedding_compute
      - ./libs:/app/libs
      - ./configs:/app/configs
    command: >
      conda run --no-capture-output -n py310_env
      uvicorn main:app
      --host 0.0.0.0
      --port 20722
      --reload

  db:
    volumes:
      - ./db:/app/db
      - ./libs:/app/libs
      - ./configs:/app/configs
    command: >
      conda run --no-capture-output -n py310_env
      uvicorn main:app
      --host 0.0.0.0
      --port 20723
      --reload